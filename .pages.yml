
media:
  - name: images
    label: Imagens
    input: media
    output: /media
    extensions: [jpg, jpeg, png, webp]
    categories: [image]
    rename: safe

content:
  - name: messages
    label: Mensagens
    type: file
    path: content/messages.json
    format: json
    list: true
    fields:
      - name: slug
        label: Endereço da mensagem
        type: string
        required: true
        description: "Use apenas letras minúsculas e hífens. Exemplo: minha-mensagem"
      - name: title
        label: Título
        type: string
        required: true

      - name: category
        label: Categoria
        type: select
        options:
          values:
            - label: Vida
              value: vida
            - label: Fé
              value: fe
            - label: Identidade
              value: identidade

      - name: reference
        label: Referência bíblica
        type: string

      - name: excerpt
        label: Resumo
        type: text

      - name: status
        label: Status da mensagem
        type: select
        required: true
        options:
          values:
            - label: Rascunho
              value: rascunho
            - label: Em revisão
              value: revisao
            - label: Publicado
              value: publicado

      - name: featured
        label: Destaque na página inicial
        type: boolean

      - name: demonstration
        label: Conteúdo demonstrativo
        type: boolean

      - name: reflectionPrompt
        label: Pergunta para reflexão
        type: text

      - name: body
        label: Conteúdo completo
        type: rich-text
        options:
          format: html
          media: images
          path: mensagens
          extensions: [jpg, jpeg, png, webp]
          rename: safe

  
  - name: events
    label: Eventos
    type: file
    path: content/events.json
    format: json
    list: true
    fields:
      - name: slug
        label: Identificador do evento
        type: string
        required: true
        description: "Use letras minúsculas e hífens. Exemplo: congresso-next-level"

      - name: title
        label: Título do evento
        type: string
        required: true

      - name: description
        label: Resumo do evento
        type: text

      - name: date
        label: Data
        type: date
        required: true

      - name: time
        label: Horário
        type: string

      - name: location
        label: Local
        type: string

      - name: image
        label: Imagem de capa
        type: image
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]

      - name: body
        label: Descrição completa
        type: rich-text
        options:
          format: html
          media: images
          path: eventos
          extensions: [jpg, jpeg, png, webp]
          rename: safe

      - name: gallery
        label: Galeria de imagens
        type: image
        list: true
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]

      - name: registrationUrl
        label: Link de inscrição
        type: string

      - name: instagramUrl
        label: Link da publicação no Instagram
        type: string

      - name: status
        label: Status do evento
        type: select
        required: true
        options:
          values:
            - label: Rascunho
              value: rascunho
            - label: Publicado
              value: publicado
            - label: Cancelado
              value: cancelado

      - name: featured
        label: Destacar na página inicial
        type: boolean


  - name: news
    label: Novidades
    type: file
    path: content/news.json
    format: json
    list: true
    fields:
      - name: slug
        label: Identificador da publicação
        type: string
        required: true
        description: "Use letras minúsculas e hífens. Exemplo: campanha-do-agasalho"

      - name: title
        label: Título
        type: string
        required: true

      - name: category
        label: Categoria
        type: select
        options:
          values:
            - label: Comunicado
              value: comunicado
            - label: Atualização
              value: atualizacao
            - label: Projeto
              value: projeto
            - label: Produto
              value: produto
            - label: Aviso
              value: aviso
            - label: Geral
              value: geral

      - name: date
        label: Data da publicação
        type: date
        required: true

      - name: summary
        label: Resumo
        type: text

      - name: image
        label: Imagem de capa
        type: image
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]

      - name: body
        label: Conteúdo completo
        type: rich-text
        options:
          format: html
          media: images
          path: novidades
          extensions: [jpg, jpeg, png, webp]
          rename: safe

      - name: linkLabel
        label: Texto do botão externo
        type: string

      - name: linkUrl
        label: Link externo
        type: string

      - name: instagramUrl
        label: Link da publicação no Instagram
        type: string

      - name: status
        label: Status da publicação
        type: select
        required: true
        options:
          values:
            - label: Rascunho
              value: rascunho
            - label: Publicado
              value: publicado

      - name: featured
        label: Destacar na página inicial
        type: boolean
        

